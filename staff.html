<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VATSIM & VATPRC 活動資訊</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-gray-800">VATPRC 活動專區</h1>
            <p class="text-gray-600 mt-2">即時同步 VATPRC 中國分部相關飛行活動</p>
            
            <!-- 切換篩選按鈕 -->
            <div class="flex justify-center gap-4 mt-6">
                <button onclick="filterEvents('all')" id="btn-all" class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow font-medium transition">所有活動</button>
                <button onclick="filterEvents('vatprc')" id="btn-vatprc" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg shadow font-medium transition">僅看 VATPRC 相關</button>
            </div>
        </header>

        <!-- 活動列表容器 -->
        <div id="events-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center text-gray-500 py-10">
                載入活動中，請稍候...
            </div>
        </div>
    </div>

    <script>
        let allEvents = [];

        async function fetchVatsimEvents() {
            const container = document.getElementById('events-container');
            
            try {
                const response = await fetch('https://api.vatsim.net/v2/events/latest');
                const data = await response.json();
                
                if (!data.data || data.data.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center text-gray-500">目前沒有即將到來的活動。</div>';
                    return;
                }

                allEvents = data.data;
                renderEvents(allEvents);

            } catch (error) {
                console.error('無法取得 VATSIM 活動資料:', error);
                container.innerHTML = '<div class="col-span-full text-center text-red-500">載入活動失敗，請檢查網路連線。</div>';
            }
        }

        function renderEvents(events) {
            const container = document.getElementById('events-container');
            container.innerHTML = '';

            if (events.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-gray-500 py-10">沒有符合條件的活動。</div>';
                return;
            }

            events.forEach(event => {
                const startDate = new Date(event.start_time).toLocaleString('zh-TW');
                
                // 判斷是否為 VATPRC 相關：
                // 1. 檢查主辦單位組織代號是否包含 PRC
                // 2. 檢查活動名稱或描述是否包含 VATPRC / Mainland / China 等關鍵字
                let isVATPRC = false;
                
                if (event.organisers) {
                    isVATPRC = event.organisers.some(org => org.division === 'PRC' || org.subdivision === 'PRC');
                }
                
                const nameDesc = (event.name + ' ' + (event.description || '')).toLowerCase();
                if (nameDesc.includes('vatprc') || nameDesc.includes('china division')) {
                    isVATPRC = true;
                }

                const card = `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden flex flex-col justify-between hover:shadow-lg transition-shadow">
                        <div>
                            ${event.banner ? `<img src="${event.banner}" alt="${event.name}" class="w-full h-48 object-cover">` : ''}
                            <div class="p-5">
                                <div class="flex justify-between items-center mb-2">
                                    <h2 class="text-xl font-bold text-gray-800 line-clamp-1">${event.name}</h2>
                                    ${isVATPRC ? '<span class="bg-red-100 text-red-600 text-xs px-2 py-1 rounded font-bold">VATPRC</span>' : ''}
                                </div>
                                <p class="text-sm text-blue-600 font-semibold mb-3">開始時間: ${startDate}</p>
                                <p class="text-gray-600 text-sm line-clamp-3">${event.description ? event.description.replace(/<[^>]*>?/gm, '') : '無活動描述'}</p>
                            </div>
                        </div>
                        <div class="p-5 pt-0">
                            <a href="${event.link || 'https://my.vatsim.net/events'}" target="_blank" class="block w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                                查看官方詳情
                            </a>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // 切換過濾功能
        function filterEvents(type) {
            const btnAll = document.getElementById('btn-all');
            const btnVATPRC = document.getElementById('btn-vatprc');

            if (type === 'all') {
                btnAll.className = "px-4 py-2 bg-blue-600 text-white rounded-lg shadow font-medium transition";
                btnVATPRC.className = "px-4 py-2 bg-gray-200 text-gray-700 rounded-lg shadow font-medium transition";
                renderEvents(allEvents);
            } else {
                btnVATPRC.className = "px-4 py-2 bg-blue-600 text-white rounded-lg shadow font-medium transition";
                btnAll.className = "px-4 py-2 bg-gray-200 text-gray-700 rounded-lg shadow font-medium transition";
                
                // 過濾出 VATPRC 相關活動
                const filtered = allEvents.filter(event => {
                    let match = false;
                    if (event.organisers) {
                        match = event.organisers.some(org => org.division === 'PRC' || org.subdivision === 'PRC');
                    }
                    const nameDesc = (event.name + ' ' + (event.description || '')).toLowerCase();
                    if (nameDesc.includes('vatprc') || nameDesc.includes('china division')) {
                        match = true;
                    }
                    return match;
                });
                renderEvents(filtered);
            }
        }

        fetchVatsimEvents();
    </script>

</body>
</html>
